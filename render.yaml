databases:
  - name: recruitment-crm-db
    plan: free
    databaseName: recruitment_crm
    user: recruitment_crm

services:
  # ── Backend API ─────────────────────────────────────────────────────────
  - type: web
    name: recruitment-crm-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recruitment-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # set to your frontend's Render URL after the first deploy
      - key: NODE_ENV
        value: production

  # ── Frontend (static site) ──────────────────────────────────────────────
  - type: web
    name: recruitment-crm-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to https://recruitment-crm-api.onrender.com/api after the API deploys
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
